<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evidence record lookup</title><link rel="stylesheet" href="/style.css"></head><body><header><div class="wrap"><p class="eyebrow">IP EVIDENCE HUB</p><h1>Evidence record lookup</h1><p>QR-linked reference lookup</p></div></header><main class="wrap"><section class="panel"><p id="lookup">Loading record…</p><a href="/">Back to dashboard</a></section></main><script>
(async()=>{const id=new URLSearchParams(location.search).get('id');const el=document.querySelector('#lookup');if(!id){el.textContent='No evidence ID was provided.';return}try{const rows=await(await fetch('/api/evidence')).json();const r=rows.find(x=>x.referenceId===id);el.textContent=r?`Reference: ${r.referenceId} | Title: ${r.title} | SHA-256: ${r.sha256} | Status: ${r.status} | Registered: ${r.registeredAt}`:'Record not found. This page only shows available record metadata.'}catch(e){el.textContent='Could not load record.'}})();
</script></body></html>
